<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>PDF Read Search P03E</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#172033}
header{position:sticky;top:0;z-index:10;background:#fff;padding:12px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left));border-bottom:1px solid #ddd}
h1{font-size:19px;margin:0 0 10px}
.row{display:flex;gap:7px;align-items:stretch}
button,.pick,input{font:inherit;border-radius:10px}
.pick,button{border:0;background:#172033;color:#fff;padding:11px 12px;font-weight:650;cursor:pointer}
.pick{white-space:nowrap;display:flex;align-items:center}
input[type=file]{display:none}
input[type=search]{flex:1;min-width:0;border:1px solid #ccd3dc;padding:11px;background:#fff}
.secondary{background:#e8edf3;color:#172033}
#status{font-size:13px;color:#687386;margin-top:8px;line-height:1.35}
main{padding:13px max(13px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(13px,env(safe-area-inset-left));max-width:820px;margin:auto}
#results{display:grid;gap:9px}
.hit{background:#fff;color:#172033;text-align:left;border:1px solid #dfe3e8;padding:12px;font-weight:400;width:100%}
.hit strong{display:block;margin-bottom:5px}
.snip{font-size:15px;line-height:1.5;color:#4d5869}
mark{background:#fff7c7;color:inherit;border-radius:3px;padding:0 .04em}
#reader{display:none}
.bar{display:flex;gap:5px;align-items:center;position:sticky;top:var(--header-h,102px);z-index:20;background:#f5f6f8;padding:7px 0 8px;border-bottom:1px solid #e5e8ed}.bar button{padding:10px 10px}.bar #keywordHome{padding-left:11px;padding-right:11px}
#where{flex:1;text-align:center;font-size:12px;line-height:1.2;min-width:54px;color:#4d5869}
#text{background:transparent;padding:0;font-size:24px;font-family:"Times New Roman",Times,serif;line-height:1.62;overflow-wrap:normal;word-break:normal;white-space:normal;width:100%;max-width:100%}.pageBlock{background:#fff;border-radius:14px;padding:20px 18px;margin:0 0 14px}.pageLabel{font-size:12px;line-height:1.2;color:#7a8493;text-align:center;margin:0 0 14px}.pageBody{overflow-wrap:break-word;word-break:normal}.pageBody p{margin:0 0 .78em;text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto}.pageBody p:last-child{margin-bottom:0}#keywordHome{white-space:nowrap}
#documentView{display:none;font-family:"Times New Roman",Times,serif;font-size:24px;line-height:1.62}.docIntro{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;color:#687386;margin:0 0 10px}.empty{background:#fff;border-radius:12px;padding:18px;color:#687386}
@media(max-width:520px){header .row{flex-wrap:wrap}.pick{flex:0 0 auto}input[type=search]{flex:1 1 160px}#go{flex:0 0 auto}#text{padding:0}.pageBlock{padding:18px 17px}.bar button{padding:10px 9px}}
</style>
</head>
<body>
<header>
  <h1>PDF Read Search <small style="font-weight:500;color:#687386">P03E</small></h1>
  <div class="row">
    <button class="pick" id="pickBtn" type="button">Chọn PDF</button><input id="file" type="file" accept="application/pdf,.pdf">
    <input id="q" type="search" placeholder="Nhập từ / cụm từ" autocomplete="off">
    <button id="go">Tìm</button>
  </div>
  <div id="status">Chọn một PDF text từ Files / OneDrive để bắt đầu.</div>
</header>

<main>
<section id="searchPane"><div id="results"></div><div id="documentView"></div></section>
<section id="reader">
  <div class="bar">
    <button class="secondary" id="back">← Kết quả</button>
    <button class="secondary" id="minus">A−</button>
    <button class="secondary" id="plus">A+</button>
    <button class="secondary" id="keywordHome" aria-label="Về từ khóa" title="Về từ khóa">◎</button>
    <div id="where"></div>
  </div>
  <article id="text"></article>
  <div class="bar" style="position:static">
    <button class="secondary" id="prev">← Trước</button>
    <button class="secondary" id="next">Sau →</button>
  </div>
</section>
</main>

<script type="module">
const el = id => document.getElementById(id);
const fileInput=el("file"), pickBtn=el("pickBtn"), statusEl=el("status"), queryEl=el("q"), go=el("go"),
      results=el("results"), searchPane=el("searchPane"), reader=el("reader"),
      where=el("where"), textEl=el("text"), documentView=el("documentView");

let pdfjsLib=null, pdf=null, pages=[], hits=[], active=0, fontSize=Number(localStorage.getItem("pdfReaderFontSize")||24), query="", selectedName="", openingFile=false;

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function lower(s){return String(s).toLocaleLowerCase()}
function highlightAll(s){
  if(!query) return esc(s);
  const src=String(s), hay=lower(src), needle=lower(query);
  let out="", p=0, i;
  while((i=hay.indexOf(needle,p))!==-1){
    out+=esc(src.slice(p,i))+"<mark>"+esc(src.slice(i,i+query.length))+"</mark>";
    p=i+Math.max(query.length,1);
  }
  return out+esc(src.slice(p));
}
async function loadPdfJs(){
  if(pdfjsLib) return pdfjsLib;
  statusEl.textContent="Đang khởi động bộ đọc PDF…";
  try{
    pdfjsLib=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
    return pdfjsLib;
  }catch(err){
    console.error(err);
    statusEl.textContent="Không tải được bộ đọc PDF. Kiểm tra Internet rồi tải lại trang.";
    throw err;
  }
}
function resetToStartForNewPdf(){
  reader.style.display="none";
  searchPane.style.display="block";
  results.style.display="none";
  results.innerHTML="";
  documentView.style.display="none";
  documentView.innerHTML="";
  hits=[]; active=0; query=""; queryEl.value="";
  window.scrollTo({top:0,behavior:"instant"});
}
async function showDocumentPreview(){
  if(!pdf) return;
  results.style.display="none";
  documentView.style.display="block";
  documentView.style.fontSize=fontSize+"px";
  documentView.innerHTML='<div class="docIntro">Nội dung PDF</div>';
  for(let n=1;n<=pdf.numPages;n++){
    if(!pdf) return;
    const raw=await getPageText(n);
    const clean=reflowPageText(raw);
    const block=document.createElement("section");
    block.className="pageBlock";
    block.dataset.page=n;
    block.innerHTML=`<div class="pageLabel">— Trang ${n} —</div><div class="pageBody"><p>${esc(clean)}</p></div>`;
    documentView.appendChild(block);
    if(n===1) statusEl.textContent=`${selectedName} • ${pdf.numPages} trang • đã nạp PDF.`;
    if(n%3===0) await new Promise(r=>setTimeout(r,0));
  }
}
pickBtn.addEventListener("click", ()=>{
  if(openingFile) return;
  resetToStartForNewPdf();
  // Reset before every picker opening so iOS also fires change when the same PDF is chosen again.
  fileInput.value="";
  fileInput.click();
});
fileInput.addEventListener("change", async ()=>{
  const f=fileInput.files?.[0];
  if(!f || openingFile) return;
  openingFile=true;
  pickBtn.disabled=true;
  pickBtn.textContent="Đang mở…";
  selectedName=f.name; pages=[]; hits=[]; pdf=null; results.innerHTML="";
  statusEl.textContent=`Đã chọn ${f.name}. Đang tải từ Files / OneDrive…`;
  try{
    // Yield once so iOS can finish handing the File Provider item to Safari.
    await new Promise(resolve=>setTimeout(resolve,0));
    const data=new Uint8Array(await f.arrayBuffer());
    statusEl.textContent=`${f.name} • đang mở PDF…`;
    const P=await loadPdfJs();
    pdf=await P.getDocument({data}).promise;
    statusEl.textContent=`${f.name} • ${pdf.numPages} trang • đang hiển thị nội dung…`;
    await showDocumentPreview();
  }catch(err){
    console.error(err);
    statusEl.textContent=`Không mở được ${f.name}. Nếu file còn ở cloud, mở OneDrive cho tải xong rồi chọn lại một lần.`;
  }finally{
    openingFile=false;
    pickBtn.disabled=false;
    pickBtn.textContent="Chọn PDF";
  }
});
async function getPageText(n){
  if(pages[n-1]!==undefined) return pages[n-1];
  const p=await pdf.getPage(n);
  const c=await p.getTextContent();
  let out="", lastY=null;
  for(const item of c.items){
    const y=item.transform?.[5];
    if(lastY!==null && y!==undefined && Math.abs(y-lastY)>5) out+="\n";
    else if(out && !out.endsWith("\n")) out+=" ";
    out+=item.str||"";
    if(y!==undefined) lastY=y;
  }
  out=out.replace(/[ \t]+/g," ").replace(/ *\n */g,"\n").replace(/\n{3,}/g,"\n\n").trim();
  pages[n-1]=out;
  return out;
}
go.addEventListener("click", async ()=>{
  if(!pdf){statusEl.textContent="Hãy chọn PDF trước.";return}
  query=queryEl.value.trim();
  if(!query){statusEl.textContent="Nhập từ hoặc cụm từ cần tìm.";return}
  hits=[]; results.innerHTML=""; results.style.display="grid"; documentView.style.display="none";
  statusEl.textContent=`Đang tìm “${query}”…`;
  const needle=lower(query);
  for(let n=1;n<=pdf.numPages;n++){
    statusEl.textContent=`Đang tìm “${query}”… trang ${n}/${pdf.numPages}`;
    const t=await getPageText(n), hay=lower(t);
    let p=0;
    while((p=hay.indexOf(needle,p))!==-1){
      hits.push({page:n,pos:p,text:t});
      p+=Math.max(needle.length,1);
    }
    await new Promise(r=>setTimeout(r,0));
  }
  if(!hits.length){
    results.innerHTML='<div class="empty">Không tìm thấy kết quả.</div>';
  }else{
    hits.forEach((h,i)=>{
      const a=Math.max(0,h.pos-100), b=Math.min(h.text.length,h.pos+query.length+160);
      const btn=document.createElement("button");
      btn.className="hit";
      btn.innerHTML=`<strong>Trang ${h.page} • kết quả ${i+1}</strong><div class="snip">${highlightAll(h.text.slice(a,b)).replace(/\n/g,"<br>")}</div>`;
      btn.addEventListener("click",()=>openHit(i));
      results.appendChild(btn);
    });
  }
  statusEl.textContent=`${selectedName} • tìm thấy ${hits.length} kết quả cho “${query}”.`;
});
queryEl.addEventListener("keydown",e=>{if(e.key==="Enter") go.click()});

function reflowPageText(t){
  const lines=String(t).split(/\n+/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length) return "";
  let joined="";
  for(const line of lines){
    if(!joined){joined=line;continue}
    if(/[-‐‑]$/.test(joined) && /^[a-zà-ỹ]/i.test(line)) joined=joined.replace(/[-‐‑]$/,"")+line;
    else joined += " " + line;
  }
  return joined.replace(/\s+/g," ").trim();
}
function highlightWithAnchor(s, targetOrdinal=-1){
  if(!query) return esc(s);
  const src=String(s), hay=lower(src), needle=lower(query);
  let out="", p=0, i, ordinal=0;
  while((i=hay.indexOf(needle,p))!==-1){
    out+=esc(src.slice(p,i));
    const id=(ordinal===targetOrdinal)?' id="activeKeyword"':'';
    out+="<mark"+id+">"+esc(src.slice(i,i+query.length))+"</mark>";
    p=i+Math.max(query.length,1); ordinal++;
  }
  return out+esc(src.slice(p));
}
function activeOrdinalOnPage(){
  const h=hits[active]; let n=0;
  for(let i=0;i<active;i++) if(hits[i].page===h.page) n++;
  return n;
}
async function openHit(i){
  if(!hits.length) return;
  active=Math.max(0,Math.min(hits.length-1,i));
  const h=hits[active];
  searchPane.style.display="none"; reader.style.display="block";
  textEl.style.fontSize=fontSize+"px";
  where.textContent=`${h.page} · ${active+1}/${hits.length}`;
  textEl.innerHTML='<div class="empty">Đang chuẩn bị 5 trang…</div>';
  const first=Math.max(1,h.page-2), last=Math.min(pdf.numPages,h.page+2);
  let html=""; const targetOrdinal=activeOrdinalOnPage();
  for(let n=first;n<=last;n++){
    const raw=await getPageText(n);
    const clean=reflowPageText(raw);
    const body=(n===h.page)?highlightWithAnchor(clean,targetOrdinal):highlightAll(clean);
    html+=`<section class="pageBlock" data-page="${n}"><div class="pageLabel">— Trang ${n} —</div><div class="pageBody"><p>${body}</p></div></section>`;
  }
  textEl.innerHTML=html;
  requestAnimationFrame(()=>{
    const target=document.getElementById("activeKeyword") || textEl.querySelector(`.pageBlock[data-page="${h.page}"]`);
    if(target) scrollTargetToReadingPosition(target, "instant");
  });
}
function scrollTargetToReadingPosition(target, behavior="smooth"){
  const headerH=document.querySelector("header")?.offsetHeight||0;
  const barH=document.querySelector("#reader > .bar")?.offsetHeight||0;
  const usable=Math.max(200, window.innerHeight-headerH-barH);
  const desired=headerH+barH+usable*0.30;
  const top=window.scrollY+target.getBoundingClientRect().top-desired;
  window.scrollTo({top:Math.max(0,top),behavior});
}
function goKeyword(){
  const target=document.getElementById("activeKeyword");
  if(target) scrollTargetToReadingPosition(target,"smooth");
}
function syncHeaderHeight(){
  const h=document.querySelector("header")?.offsetHeight||0;
  document.documentElement.style.setProperty("--header-h",h+"px");
}
syncHeaderHeight();
window.addEventListener("resize",syncHeaderHeight);
if(window.ResizeObserver){new ResizeObserver(syncHeaderHeight).observe(document.querySelector("header"));}
el("keywordHome").onclick=goKeyword;
el("back").onclick=()=>{reader.style.display="none";searchPane.style.display="block";results.style.display="grid";documentView.style.display="none";window.scrollTo({top:0,behavior:"instant"})};
el("minus").onclick=()=>{fontSize=Math.max(16,fontSize-2);textEl.style.fontSize=fontSize+"px";documentView.style.fontSize=fontSize+"px";localStorage.setItem("pdfReaderFontSize",fontSize)};
el("plus").onclick=()=>{fontSize=Math.min(52,fontSize+2);textEl.style.fontSize=fontSize+"px";documentView.style.fontSize=fontSize+"px";localStorage.setItem("pdfReaderFontSize",fontSize)};
el("prev").onclick=()=>openHit(active-1);
el("next").onclick=()=>openHit(active+1);
</script>
</body>
</html>
