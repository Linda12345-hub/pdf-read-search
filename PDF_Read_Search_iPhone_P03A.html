<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>PDF Read Search P03A</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#172033}
header{position:sticky;top:0;z-index:10;background:#fff;padding:12px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left));border-bottom:1px solid #ddd}
h1{font-size:19px;margin:0 0 10px}
.row{display:flex;gap:7px;align-items:stretch}
button,.pick,input{font:inherit;border-radius:10px}
.pick,button{border:0;background:#172033;color:#fff;padding:11px 12px;font-weight:650;cursor:pointer}
.pick{white-space:nowrap;display:flex;align-items:center}
input[type=file]{display:none}
input[type=search]{flex:1;min-width:0;border:1px solid #ccd3dc;padding:11px;background:#fff}
.secondary{background:#e8edf3;color:#172033}
#status{font-size:13px;color:#687386;margin-top:8px;line-height:1.35}
main{padding:13px max(13px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(13px,env(safe-area-inset-left));max-width:820px;margin:auto}
#results{display:grid;gap:9px}
.hit{background:#fff;color:#172033;text-align:left;border:1px solid #dfe3e8;padding:12px;font-weight:400;width:100%}
.hit strong{display:block;margin-bottom:5px}
.snip{font-size:15px;line-height:1.5;color:#4d5869}
mark{background:#ffe16b;color:inherit;border-radius:2px}
#reader{display:none}
.bar{display:flex;gap:6px;align-items:center;position:sticky;top:102px;z-index:5;background:#f5f6f8;padding:7px 0}
#where{flex:1;text-align:center;font-size:13px}
#text{background:#fff;border-radius:14px;padding:20px 16px;font-size:24px;line-height:1.62;overflow-wrap:anywhere;word-break:normal;white-space:normal;width:100%;max-width:100%}
.empty{background:#fff;border-radius:12px;padding:18px;color:#687386}
#pdfViewer{display:none;background:#d9dde3;margin:-13px;padding:10px 0 28px;min-height:100vh}
.viewerbar{position:sticky;top:102px;z-index:30;display:flex;gap:6px;align-items:center;background:rgba(245,246,248,.96);padding:7px 10px;border-bottom:1px solid #ccd3dc}
#pdfWhere{flex:1;text-align:center;font-size:13px;font-weight:650}
#pagesHost{display:grid;gap:12px;justify-items:center;padding-top:10px}
.pdfpage{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.16);overflow:hidden}
.pdfpage canvas{display:block;width:100%;height:100%}
.textLayer{position:absolute;inset:0;overflow:hidden;opacity:1;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0}
.textLayer span,.textLayer br{position:absolute;color:transparent;white-space:pre;transform-origin:0% 0%;cursor:text}
.textLayer .pdf-hit{background:rgba(255,214,0,.62);box-shadow:0 0 0 1px rgba(180,120,0,.35);border-radius:2px;color:transparent}
.textLayer .pdf-hit.active-hit{background:rgba(255,145,0,.72);box-shadow:0 0 0 2px rgba(180,75,0,.55)}
@media(max-width:520px){header .row{flex-wrap:wrap}.pick{flex:0 0 auto}input[type=search]{flex:1 1 160px}#go{flex:0 0 auto}.bar{top:145px}#text{padding:18px 14px}}
</style>
</head>
<body>
<header>
  <h1>PDF Read Search <small style="font-weight:500;color:#687386">P03A</small></h1>
  <div class="row">
    <label class="pick">Chọn PDF<input id="file" type="file" accept="application/pdf,.pdf"></label>
    <input id="q" type="search" placeholder="Nhập từ / cụm từ" autocomplete="off">
    <button id="go">Tìm</button>
  </div>
  <div id="status">Chọn một PDF text từ Files / OneDrive để bắt đầu.</div>
</header>

<main>
<section id="searchPane"><div id="results"></div></section>
<section id="reader">
  <div class="bar">
    <button class="secondary" id="back">← Kết quả</button>
    <button class="secondary" id="minus">A−</button>
    <button class="secondary" id="plus">A+</button>
    <div id="where"></div>
  </div>
  <article id="text"></article>
  <div class="bar" style="position:static">
    <button class="secondary" id="prev">← Trước</button>
    <button class="secondary" id="next">Sau →</button>
  </div>
</section>
<section id="pdfViewer">
  <div class="viewerbar">
    <button class="secondary" id="pdfBack">← Kết quả</button>
    <button class="secondary" id="pdfPrev">←</button>
    <div id="pdfWhere"></div>
    <button class="secondary" id="pdfNext">→</button>
    <button class="secondary" id="toRead">Read</button>
  </div>
  <div id="pagesHost"></div>
</section>
</main>

<script type="module">
const el = id => document.getElementById(id);
const fileInput=el("file"), statusEl=el("status"), queryEl=el("q"), go=el("go"),
      results=el("results"), searchPane=el("searchPane"), reader=el("reader"),
      where=el("where"), textEl=el("text"), pdfViewer=el("pdfViewer"), pagesHost=el("pagesHost"), pdfWhere=el("pdfWhere");

let pdfjsLib=null, pdf=null, pages=[], hits=[], active=0, fontSize=24, query="", selectedName="";
let renderObserver=null, pageSlots=new Map(), pageTextCache=new Map();

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function lower(s){return String(s).toLocaleLowerCase()}
function highlightAll(s){
  if(!query) return esc(s);
  const src=String(s), hay=lower(src), needle=lower(query);
  let out="", p=0, i;
  while((i=hay.indexOf(needle,p))!==-1){
    out+=esc(src.slice(p,i))+"<mark>"+esc(src.slice(i,i+query.length))+"</mark>";
    p=i+Math.max(query.length,1);
  }
  return out+esc(src.slice(p));
}
async function loadPdfJs(){
  if(pdfjsLib) return pdfjsLib;
  statusEl.textContent="Đang khởi động bộ đọc PDF…";
  try{
    pdfjsLib=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
    return pdfjsLib;
  }catch(err){
    console.error(err);
    statusEl.textContent="Không tải được bộ đọc PDF. Kiểm tra Internet rồi tải lại trang.";
    throw err;
  }
}
fileInput.addEventListener("change", async ()=>{
  const f=fileInput.files?.[0];
  if(!f) return;
  selectedName=f.name; pages=[]; hits=[]; pdf=null; results.innerHTML=""; pageTextCache.clear(); pageSlots.clear(); pagesHost.innerHTML="";
  statusEl.textContent=`Đã nhận ${f.name}. Đang đọc PDF…`;
  try{
    const P=await loadPdfJs();
    const data=new Uint8Array(await f.arrayBuffer());
    pdf=await P.getDocument({data}).promise;
    statusEl.textContent=`${f.name} • ${pdf.numPages} trang • sẵn sàng tìm.`;
  }catch(err){
    console.error(err);
    statusEl.textContent=`Không mở được ${f.name}. Hãy thử lại hoặc chọn PDF khác.`;
  }
});
async function getPageText(n){
  if(pages[n-1]!==undefined) return pages[n-1];
  const p=await pdf.getPage(n);
  const c=await p.getTextContent();
  let out="", lastY=null;
  for(const item of c.items){
    const y=item.transform?.[5];
    if(lastY!==null && y!==undefined && Math.abs(y-lastY)>5) out+="\n";
    else if(out && !out.endsWith("\n")) out+=" ";
    out+=item.str||"";
    if(y!==undefined) lastY=y;
  }
  out=out.replace(/[ \t]+/g," ").replace(/ *\n */g,"\n").replace(/\n{3,}/g,"\n\n").trim();
  pages[n-1]=out;
  return out;
}
go.addEventListener("click", async ()=>{
  if(!pdf){statusEl.textContent="Hãy chọn PDF trước.";return}
  query=queryEl.value.trim();
  if(!query){statusEl.textContent="Nhập từ hoặc cụm từ cần tìm.";return}
  hits=[]; results.innerHTML="";
  statusEl.textContent=`Đang tìm “${query}”…`;
  const needle=lower(query);
  for(let n=1;n<=pdf.numPages;n++){
    statusEl.textContent=`Đang tìm “${query}”… trang ${n}/${pdf.numPages}`;
    const t=await getPageText(n), hay=lower(t);
    let p=0, pageHitIndex=0;
    while((p=hay.indexOf(needle,p))!==-1){
      hits.push({page:n,pos:p,text:t,pageHitIndex});
      pageHitIndex++;
      p+=Math.max(needle.length,1);
    }
    await new Promise(r=>setTimeout(r,0));
  }
  if(!hits.length){
    results.innerHTML='<div class="empty">Không tìm thấy kết quả.</div>';
  }else{
    hits.forEach((h,i)=>{
      const a=Math.max(0,h.pos-100), b=Math.min(h.text.length,h.pos+query.length+160);
      const btn=document.createElement("button");
      btn.className="hit";
      btn.innerHTML=`<strong>Trang ${h.page} • kết quả ${i+1}</strong><div class="snip">${highlightAll(h.text.slice(a,b)).replace(/\n/g,"<br>")}</div>`;
      btn.addEventListener("click",()=>openPdfHit(i));
      results.appendChild(btn);
    });
  }
  statusEl.textContent=`${selectedName} • tìm thấy ${hits.length} kết quả cho “${query}”.`;
});
queryEl.addEventListener("keydown",e=>{if(e.key==="Enter") go.click()});


function pageWidth(){return Math.min(820, Math.max(280, window.innerWidth-20))}
async function buildPdfViewer(){
  pagesHost.innerHTML=""; pageSlots.clear();
  const width=pageWidth();
  for(let n=1;n<=pdf.numPages;n++){
    const pg=await pdf.getPage(n), base=pg.getViewport({scale:1});
    const scale=width/base.width, vp=pg.getViewport({scale});
    const slot=document.createElement("div"); slot.className="pdfpage"; slot.dataset.page=n;
    slot.style.width=Math.floor(vp.width)+"px"; slot.style.height=Math.floor(vp.height)+"px";
    pagesHost.appendChild(slot); pageSlots.set(n,{slot,scale,rendered:false,rendering:false});
  }
  if(renderObserver) renderObserver.disconnect();
  renderObserver=new IntersectionObserver(entries=>{
    for(const e of entries) if(e.isIntersecting) renderPage(Number(e.target.dataset.page));
  },{rootMargin:"1200px 0px"});
  pageSlots.forEach(v=>renderObserver.observe(v.slot));
}
async function renderPage(n){
  const rec=pageSlots.get(n); if(!rec||rec.rendered||rec.rendering) return;
  rec.rendering=true;
  try{
    const pg=await pdf.getPage(n), vp=pg.getViewport({scale:rec.scale});
    const canvas=document.createElement("canvas"), ctx=canvas.getContext("2d",{alpha:false});
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.floor(vp.width*dpr); canvas.height=Math.floor(vp.height*dpr);
    canvas.style.width=vp.width+"px"; canvas.style.height=vp.height+"px";
    rec.slot.appendChild(canvas);
    await pg.render({canvasContext:ctx,viewport:vp,transform:dpr===1?null:[dpr,0,0,dpr,0,0]}).promise;
    const tc=await pg.getTextContent(); pageTextCache.set(n,tc);
    const layer=document.createElement("div"); layer.className="textLayer"; rec.slot.appendChild(layer);
    const tl=new pdfjsLib.TextLayer({textContentSource:tc,container:layer,viewport:vp});
    await tl.render();
    rec.layer=layer; rec.rendered=true; rec.rendering=false;
    applyHighlights(n);
  }catch(e){console.error(e);rec.rendering=false}
}
function textNodesIn(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const a=[]; let n;
  while(n=w.nextNode()) if(n.nodeValue) a.push(n); return a;
}
function applyHighlights(pageNo){
  const rec=pageSlots.get(pageNo); if(!rec?.layer||!query) return;
  rec.layer.querySelectorAll("mark.pdf-hit").forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));
  rec.layer.normalize();
  const nodes=textNodesIn(rec.layer), map=[]; let joined="";
  for(const node of nodes){
    if(joined && !/\s$/.test(joined) && !/^\s/.test(node.nodeValue)){joined+=" ";map.push(null)}
    for(let i=0;i<node.nodeValue.length;i++){joined+=node.nodeValue[i];map.push({node,off:i})}
  }
  const hay=lower(joined), needle=lower(query); let p=0, occurrence=0;
  const ranges=[];
  while((p=hay.indexOf(needle,p))!==-1){ranges.push({p,occurrence});occurrence++;p+=Math.max(needle.length,1)}
  for(let r=ranges.length-1;r>=0;r--){
    const {p,occurrence}=ranges[r]; let a=p,b=p+query.length-1;
    while(a<=b&&!map[a])a++; while(b>=a&&!map[b])b--;
    if(a>b) continue; const A=map[a],B=map[b];
    try{
      const range=document.createRange();range.setStart(A.node,A.off);range.setEnd(B.node,B.off+1);
      const mark=document.createElement("mark");mark.className="pdf-hit";mark.dataset.occ=occurrence;range.surroundContents(mark);
    }catch(e){}
  }
}
async function focusActiveHit(){
  const h=hits[active]; if(!h)return;
  pdfWhere.textContent=`Trang ${h.page} • ${active+1}/${hits.length}`;
  await renderPage(h.page);
  const rec=pageSlots.get(h.page);
  rec.layer?.querySelectorAll(".active-hit").forEach(x=>x.classList.remove("active-hit"));
  const target=rec.layer?.querySelector(`.pdf-hit[data-occ="${h.pageHitIndex}"]`);
  if(target){target.classList.add("active-hit");target.scrollIntoView({block:"center",behavior:"instant"})}
  else rec.slot.scrollIntoView({block:"start",behavior:"instant"});
}
async function openPdfHit(i){
  if(!hits.length)return; active=Math.max(0,Math.min(hits.length-1,i));
  searchPane.style.display="none"; reader.style.display="none"; pdfViewer.style.display="block";
  if(pageSlots.size!==pdf.numPages) await buildPdfViewer();
  await focusActiveHit();
}

function readerChunk(h){
  let a=Math.max(0,h.pos-900), b=Math.min(h.text.length,h.pos+query.length+2200);
  const before=h.text.lastIndexOf("\n",h.pos);
  if(before>=0 && h.pos-before<900) a=before+1;
  const after=h.text.indexOf("\n",h.pos+query.length);
  if(after>=0 && after-h.pos<2200) b=Math.max(after,b>after+1200?after:b);
  return h.text.slice(a,b);
}
function openHit(i){
  if(!hits.length) return;
  active=Math.max(0,Math.min(hits.length-1,i));
  const h=hits[active];
  searchPane.style.display="none"; pdfViewer.style.display="none"; reader.style.display="block";
  where.textContent=`Trang ${h.page} • ${active+1}/${hits.length}`;
  textEl.style.fontSize=fontSize+"px";
  textEl.innerHTML=highlightAll(readerChunk(h)).replace(/\n/g,"<br>");
  window.scrollTo({top:0,behavior:"instant"});
}
el("back").onclick=()=>{reader.style.display="none";pdfViewer.style.display="none";searchPane.style.display="block";window.scrollTo({top:0,behavior:"instant"})};
el("pdfBack").onclick=()=>{pdfViewer.style.display="none";searchPane.style.display="block";window.scrollTo({top:0,behavior:"instant"})};
el("pdfPrev").onclick=()=>{if(active>0){active--;focusActiveHit()}};
el("pdfNext").onclick=()=>{if(active<hits.length-1){active++;focusActiveHit()}};
el("toRead").onclick=()=>openHit(active);
el("minus").onclick=()=>{fontSize=Math.max(16,fontSize-2);textEl.style.fontSize=fontSize+"px"};
el("plus").onclick=()=>{fontSize=Math.min(52,fontSize+2);textEl.style.fontSize=fontSize+"px"};
el("prev").onclick=()=>openHit(active-1);
el("next").onclick=()=>openHit(active+1);
</script>
</body>
</html>
